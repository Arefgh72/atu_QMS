name: QMS Swap Cycle

on:
  schedule:
    # every 12 hours: 00:00 and 12:00 UTC
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      amount_qms:
        description: "Amount of QMS per cycle"
        required: false
        default: "0.001"
      slippage_bps:
        description: "Slippage tolerance in basis points (200 = 2%)"
        required: false
        default: "200"
      dry_run:
        description: "Dry run: quotes only, sends no transactions"
        required: false
        type: choice
        options: ["0", "1"]
        default: "0"

permissions:
  contents: write

concurrency:
  group: qms-swap-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run swap cycle
        env:
          EVM_PRIVATE_KEY: ${{ secrets.EVM_PRIVATE_KEY }}
          RPC_URL: "https://rpc.testnet.qms.finance"
          AMOUNT_QMS: ${{ inputs.amount_qms || '0.001' }}
          SLIPPAGE_BPS: ${{ inputs.slippage_bps || '200' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: node scripts/qms-swap-cycle.mjs

      - name: Commit log
        if: always()
        run: |
          git config user.name "qms-swap-bot"
          git config user.email "qms-swap-bot@users.noreply.github.com"
          mkdir -p logs
          git add logs/
          if git diff --cached --quiet; then
            echo "No log changes to commit."
          else
            git commit -m "log: swap cycle $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
